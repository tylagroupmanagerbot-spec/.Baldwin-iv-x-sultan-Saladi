services:
  - type: web
    name: whatsapp-bot
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: WHATSAPP_API_TOKEN
        scope: run
        sync: false
      - key: BUSINESS_PHONE_NUMBER_ID
        scope: run
        sync: false
      - key: WEBHOOK_VERIFY_TOKEN
        scope: run
        sync: false
      - key: NODE_ENV
        value: production
